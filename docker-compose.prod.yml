services:
  traefik:
    image: traefik:v2.11
    command:
      - --api.insecure=false
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.leresolver.acme.httpchallenge=true
      - --certificatesresolvers.leresolver.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.leresolver.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.leresolver.acme.storage=/letsencrypt/acme.json
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./letsencrypt:/letsencrypt
      - ./middlewares.yml:/etc/traefik/middlewares.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`${TRAEFIK_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=leresolver"
      - "traefik.http.routers.traefik-dashboard.middlewares=security-headers@file"
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexus-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-papers}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    labels:
      - traefik.enable=false
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nexus-redis-prod
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    labels:
      - traefik.enable=false
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-backend-prod
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-papers}
      - DB_PORT=${DB_PORT:-5432}
      - PORT=8000
      - STORAGE_PATH=/app/storage/papers
      - DEBUG=false
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY}
      - SERPAPI_KEY=${SERPAPI_KEY}
      - OPENALEX_API_KEY=${OPENALEX_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - AI_KEY_ENCRYPTION_KEY=${AI_KEY_ENCRYPTION_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - FRONTEND_URL=https://${FRONTEND_DOMAIN}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_ENABLED=${EMAIL_ENABLED}
      - APP_URL=https://${FRONTEND_DOMAIN}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-gemini-embedding-001}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-768}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - ./backend/storage:/app/storage
    labels:
      - traefik.enable=true
      # Main application router
      - traefik.http.routers.nexus-backend.rule=Host(`${BACKEND_DOMAIN}`)
      - traefik.http.routers.nexus-backend.entrypoints=websecure
      - traefik.http.routers.nexus-backend.tls.certresolver=leresolver
      - traefik.http.routers.nexus-backend.service=nexus-backend-service
      - traefik.http.routers.nexus-backend.middlewares=security-headers@file
      # Main application service
      - traefik.http.services.nexus-backend-service.loadbalancer.server.port=8000
      - traefik.http.services.nexus-backend-service.loadbalancer.healthcheck.path=/health
      - traefik.http.services.nexus-backend-service.loadbalancer.healthcheck.interval=10s
      - traefik.http.services.nexus-backend-service.loadbalancer.healthcheck.timeout=3s
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker -l info -Q ai,processing,discovery,dead_letter -c 4 --hostname=interactive@%h
    deploy:
      replicas: 2
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-papers}
      - DB_PORT=${DB_PORT:-5432}
      - STORAGE_PATH=/app/storage/papers
      - DEBUG=false
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY}
      - SERPAPI_KEY=${SERPAPI_KEY}
      - OPENALEX_API_KEY=${OPENALEX_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - AI_KEY_ENCRYPTION_KEY=${AI_KEY_ENCRYPTION_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - FRONTEND_URL=https://${FRONTEND_DOMAIN}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_ENABLED=${EMAIL_ENABLED}
      - APP_URL=https://${FRONTEND_DOMAIN}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-gemini-embedding-001}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-768}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - ./backend/storage:/app/storage
    labels:
      - traefik.enable=false
    restart: unless-stopped

  # Celery beat — schedules periodic jobs (the retry sweep for incomplete AI
  # processing). Run exactly one instance; the worker(s) above execute the jobs.
  research-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker -l info -Q research -c 1 --hostname=research@%h
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-papers}
      - DB_PORT=${DB_PORT:-5432}
      - STORAGE_PATH=/app/storage/papers
      - DEBUG=false
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY}
      - SERPAPI_KEY=${SERPAPI_KEY}
      - OPENALEX_API_KEY=${OPENALEX_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - AI_KEY_ENCRYPTION_KEY=${AI_KEY_ENCRYPTION_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - FRONTEND_URL=https://${FRONTEND_DOMAIN}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_ENABLED=${EMAIL_ENABLED}
      - APP_URL=https://${FRONTEND_DOMAIN}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-gemini-embedding-001}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-768}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - ./backend/storage:/app/storage
    labels:
      - traefik.enable=false
    restart: unless-stopped

  # Celery beat — schedules periodic jobs (the retry sweep for incomplete AI
  # processing). Run exactly one instance; the worker(s) above execute the jobs.

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app beat -l info
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-papers}
      - DB_PORT=${DB_PORT:-5432}
      - STORAGE_PATH=/app/storage/papers
      - DEBUG=false
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - AI_KEY_ENCRYPTION_KEY=${AI_KEY_ENCRYPTION_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-gemini-embedding-001}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-768}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    labels:
      - traefik.enable=false
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-v2
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://${BACKEND_DOMAIN}/api/v1
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    container_name: nexus-frontend-prod
    depends_on:
      - backend
    networks:
      - app-network
    labels:
      - traefik.enable=true
      # Main application router
      - traefik.http.routers.nexus-frontend.rule=Host(`${FRONTEND_DOMAIN}`)
      - traefik.http.routers.nexus-frontend.entrypoints=websecure
      - traefik.http.routers.nexus-frontend.tls.certresolver=leresolver
      - traefik.http.routers.nexus-frontend.service=nexus-frontend-service
      - traefik.http.routers.nexus-frontend.middlewares=security-headers@file
      # Main application service
      - traefik.http.services.nexus-frontend-service.loadbalancer.server.port=4173
      - traefik.http.services.nexus-frontend-service.loadbalancer.healthcheck.path=/
      - traefik.http.services.nexus-frontend-service.loadbalancer.healthcheck.interval=10s
      - traefik.http.services.nexus-frontend-service.loadbalancer.healthcheck.timeout=3s
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
